server {
    listen 80;
    server_name www.bullionpricer.com bullionpricer.com;
    server_tokens off;
    client_max_body_size 20M;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name www.bullionpricer.com;
    server_tokens off;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/bullionpricer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bullionpricer.com/privkey.pem;

    # Redirect https://www. to https://
    return 301 https://bullionpricer.com$request_uri;
}

server {
    listen 443 ssl;
    server_name bullionpricer.com;
    server_tokens off;
    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/bullionpricer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bullionpricer.com/privkey.pem;

    # Ensure strong security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Try loading files from locally if possible(aka we're on a prod build)
        # If we can't load files from locally, we're on a dev build. proxy to the react container
        try_files $uri /index.html @bp-react;
    }

    location @bp-react {
        proxy_set_header Host $host;
        resolver 127.0.0.11 valid=30s;
        set $target "http://bp-react:3000"; #Some magic. Makes sure nginx doesn't crash if the upstream isn't found(This won't be found in prod)
        proxy_pass $target;

        #The three lines below are for allowing socket live code reloading with ssl(on dev).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api {
        proxy_set_header Host $host;
        proxy_pass http://bp-api:5000/api;
    }
}